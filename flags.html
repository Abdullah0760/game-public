<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--
  ═══════════ لا تعدّل هذا التعليق ═══════════
  الملف: games/flags.html — لعبة «الأعلام والعواصم» (رمزها في السجل: flags).
  - صفحة مستقلة تعمل وحدها بلا خادم وبلا اتصال. لا روابط لبقية الموقع ولا روابط خارجية، وزر 🎮 يرجع لبوابة الألعاب فقط.
  - الستايل: الاحتياطي داخلها (fallback، ألوانه متغيرات --g-*)، ثم ستايل games من share يغيّر الألوان والخط لكل الألعاب الجديدة معاً، ثم ستايل اللعبة نفسها.
  - الاسم: يُقرأ من بوابة الألعاب (game.name)، ولا يُسأل عنه إلا إذا فُتحت اللعبة وحدها بلا اسم.
  - السجل: كل جولة 10 أسئلة: score = الصحيح من 10، level 1 الأعلام، 2 العواصم، result «7 من 10».
  ═══════════════════════════════════════════
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a3fd0">
<title>الأعلام والعواصم</title>
<style id="fallback">
:root{
  --g-bg:#fbeef6; --g-bg2:#efe6ff; --g-ink:#3a2463; --g-sub:#7a6a98; --g-card:#ffffff; --g-line:#eadff7;
  --g-accent:#6a3fd0; --g-accent-d:#4a2a9a; --g-pink:#ff7aa8; --g-pink-d:#d9507f;
  --g-ok:#22b067; --g-ok-d:#168a4f; --g-bad:#ef4b5f; --g-bad-d:#b9293b; --g-warn:#ffc233; --g-warn-d:#c99100;
  --g-font:Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--g-font);color:var(--g-ink);background:linear-gradient(180deg,var(--g-bg),var(--g-bg2));background-attachment:fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--g-accent);outline-offset:2px}
.g-app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:8px 14px 18px;padding-top:max(8px,env(safe-area-inset-top))}
.g-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.g-top h1{flex:1;margin:0;font-size:22px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-ic{width:44px;height:44px;flex:none;border:0;border-radius:14px;background:var(--g-card);box-shadow:0 3px 0 var(--g-line);font-size:20px;display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--g-ink)}
.g-ic:active{transform:translateY(2px);box-shadow:0 1px 0 var(--g-line)}
.g-who{max-width:110px;height:44px;flex:none;border:0;border-radius:14px;background:var(--g-card);box-shadow:0 3px 0 var(--g-line);font-size:15px;font-weight:700;padding:0 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-card{background:var(--g-card);border:2px solid var(--g-line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--g-line)}
.g-btn{display:block;width:100%;min-height:56px;border:0;border-radius:18px;background:var(--g-accent);color:#fff;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--g-accent-d);cursor:pointer;margin-top:12px;padding:8px 14px}
.g-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--g-accent-d)}
.g-btn.soft{background:var(--g-card);color:var(--g-ink);box-shadow:0 5px 0 var(--g-line);border:2px solid var(--g-line)}
.g-btn.soft:active{box-shadow:0 1px 0 var(--g-line)}
.g-btn.warn{background:var(--g-warn);color:#3d2a00;box-shadow:0 5px 0 var(--g-warn-d)}
.g-btn.warn:active{box-shadow:0 1px 0 var(--g-warn-d)}
.g-btn:disabled{opacity:.45;cursor:default;transform:none}
.g-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.g-opts button{flex:1 1 28%;min-height:66px;border:3px solid var(--g-line);background:var(--g-card);border-radius:18px;font-size:18px;font-weight:700;cursor:pointer;padding:6px 4px}
.g-opts button small{display:block;font-size:13px;color:var(--g-sub);font-weight:400;margin-top:2px}
.g-opts button.sel{border-color:var(--g-accent);background:var(--g-accent);color:#fff}
.g-opts button.sel small{color:#fff}
.g-scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,20,70,.55);z-index:30;overflow-y:auto}
.g-scr.on{display:flex}
.g-scr.full{background:linear-gradient(180deg,var(--g-bg),var(--g-bg2))}
.g-box{width:100%;max-width:400px;text-align:center;background:var(--g-card);border-radius:26px;padding:22px 18px;box-shadow:0 8px 0 var(--g-line);margin:auto}
.g-big{font-size:72px;line-height:1.1}
.g-box h2{margin:6px 0;font-size:28px}
.g-box p{margin:6px 0;color:var(--g-sub);font-size:17px;line-height:1.6}
.g-box label{display:block;font-size:18px;font-weight:700;margin:14px 0 6px}
.g-hi{font-size:18px;font-weight:700;color:var(--g-accent);min-height:1.4em}
.g-in{width:100%;font:inherit;font-size:22px;text-align:center;padding:12px;border:3px solid var(--g-line);border-radius:16px;background:#fff;color:#2a1d48}
.g-recent{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.g-recent button{font:inherit;font-size:16px;border:2px solid var(--g-line);background:var(--g-bg2);border-radius:20px;padding:6px 14px;cursor:pointer}
.g-score{font-size:56px;font-weight:700;color:var(--g-accent);line-height:1.2}
.g-best{font-size:16px;color:var(--g-sub)}
.g-new{display:inline-block;background:var(--g-warn);color:#3d2a00;border-radius:12px;padding:2px 10px;font-weight:700;margin-top:4px}
.g-dl{display:block;margin-top:16px;font-size:15px;color:var(--g-sub);text-decoration:underline}
.g-dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-areas:". u ." "l d r";gap:8px;justify-content:center;margin-top:10px;direction:ltr}
.g-dpad button{height:58px;border:0;border-radius:16px;background:var(--g-card);box-shadow:0 4px 0 var(--g-line);font-size:26px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.g-dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g-line)}
.g-dpad .u{grid-area:u}.g-dpad .l{grid-area:l}.g-dpad .d{grid-area:d}.g-dpad .r{grid-area:r}
#g-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;display:none}
@keyframes g-pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes g-shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.g-popin{animation:g-pop .45s ease both}
.g-shake{animation:g-shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="/styles/games/style.css" onerror="this.remove()">
<style id="page-style">
.dots{display:flex;gap:5px;justify-content:center;margin:2px 0 10px}
.dots i{flex:1;max-width:28px;height:10px;border-radius:6px;background:var(--g-line)}
.dots i.ok{background:var(--g-ok)} .dots i.bad{background:var(--g-bad)} .dots i.now{background:var(--g-accent)}
.qnum{text-align:center;color:var(--g-sub);font-size:15px;font-weight:700}
.flag{display:flex;justify-content:center;margin:10px 0}
.flag svg{width:min(78vw,300px);height:auto;border-radius:10px;box-shadow:0 4px 14px rgba(40,20,70,.18);direction:ltr}
.flag.small svg{width:min(40vw,150px)}
.q{font-size:23px;font-weight:700;line-height:1.6;text-align:center;margin:6px 0 12px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans button{min-height:66px;border:3px solid var(--g-line);border-radius:18px;background:var(--g-card);box-shadow:0 5px 0 var(--g-line);font-size:19px;font-weight:700;cursor:pointer;padding:6px;line-height:1.3}
.ans button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--g-line)}
.ans button:disabled{cursor:default;transform:none}
.ans button.ok{background:var(--g-ok);border-color:var(--g-ok);color:#fff;box-shadow:0 5px 0 var(--g-ok-d)}
.ans button.bad{background:var(--g-bad);border-color:var(--g-bad);color:#fff;box-shadow:0 5px 0 var(--g-bad-d)}
.fb{text-align:center;font-size:20px;font-weight:700;min-height:1.6em;margin-top:12px}
.g-opts button i{display:block;font-style:normal;font-size:28px}
</style>
</head>
<body data-no-site-header="1">
<div class="g-app">
  <header class="g-top">
    <a class="g-ic" href="./" aria-label="الألعاب">🎮</a>
    <h1>الأعلام والعواصم</h1>
    <button class="g-ic" id="g-sound" aria-label="الصوت">🔊</button>
    <button class="g-who" id="g-who" aria-label="تغيير الاسم">مين يلعب؟</button>
  </header>
<div class="dots" id="dots"></div>
  <div class="g-card">
    <div class="qnum" id="qnum"></div>
    <div class="flag" id="flag"></div>
    <div class="q" id="q"></div>
    <div class="ans" id="ans"></div>
    <div class="fb" id="fb" role="status" aria-live="polite"></div>
  </div>
  <button class="g-btn soft" id="menu">غيّر الإعدادات ⚙️</button>

  <div class="g-scr full on" id="start">
    <div class="g-box">
      <div class="g-big">🌍🚩</div>
      <h2>الأعلام والعواصم</h2>
      <div class="g-hi" id="g-hi"></div>
      <p>عشرة أسئلة: تعرف علم الدولة؟ ولا عاصمتها؟</p>
      <label>وش تبغى؟</label>
      <div class="g-opts" id="lvl">
        <button data-v="1"><i>🚩</i>الأعلام</button>
        <button data-v="2"><i>🏙️</i>العواصم</button>
      </div>
      <button class="g-btn warn" id="go">يلا نبدأ! 🚀</button>
    </div>
  </div>
</div>
<div class="g-scr" id="g-res" role="dialog" aria-modal="true" aria-labelledby="g-res-t">
  <div class="g-box">
    <div class="g-big g-popin" id="g-res-e"></div>
    <h2 id="g-res-t"></h2>
    <p id="g-res-s"></p>
    <div class="g-score" id="g-res-n"></div>
    <div class="g-best" id="g-res-b"></div>
    <button class="g-btn warn" id="g-res-again">العب مرة ثانية 🔁</button>
    <button class="g-btn soft" id="g-res-menu">غيّر الإعدادات ⚙️</button>
  </div>
</div>
<div class="g-scr full" id="g-name" role="dialog" aria-modal="true" aria-labelledby="g-name-t">
  <div class="g-box">
    <div class="g-big">👋</div>
    <h2 id="g-name-t">مين يلعب؟</h2>
    <p>اكتب اسمك عشان تنحسب نتيجتك</p>
    <div class="g-recent" id="g-recent"></div>
    <input class="g-in" id="g-name-in" maxlength="30" placeholder="اسمك" autocomplete="off">
    <button class="g-btn" id="g-name-ok">يلا 🚀</button>
  </div>
</div>
<canvas id="g-fx"></canvas>

      e.preventDefault(); fn(M[e.key], true, e.repeat);
    });
    document.addEventListener("keyup", function (e) { if (M[e.key]) fn(M[e.key], false); });
  }
  /* لون من متغيرات الستايل، حتى ترسم اللوحات بألوان ستايل الألعاب */
  function css(name, def) {
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || def; } catch (e) { return def; }
  }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function shake(el) { el.classList.remove("g-shake"); void el.offsetWidth; el.classList.add("g-shake"); }

  /* زر تحميل اللعبة: على الكمبيوتر فقط، لأن الجوال لا يشغّل الملف المحمَّل */
  function download() {
    try {
      if (location.protocol === "file:") return;
      var ua = navigator.userAgent || "";
      var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
      var fine = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
      var box = document.querySelector("#start .g-box");
      if (mobile || !fine || !box) return;
      var f = location.pathname.split("/").pop() || "index.html";
      var a = document.createElement("a"); a.className = "g-dl"; a.href = f; a.download = (document.title || f) + ".html";
      a.textContent = "⬇️ حمّل اللعبة للكمبيوتر (تعمل بلا إنترنت)";
      box.appendChild(a);
    } catch (e) {}
  }

  function init() {
    showName(); showSound(); download();
    $("g-sound").onclick = function () { muted = !muted; set("game.muted", muted ? "1" : "0"); showSound(); if (!muted) sfx.tap(); };
    $("g-who").onclick = function () { askName(); };
    $("g-name-ok").onclick = nameOk;
    $("g-name-in").onkeydown = function (e) { if (e.key === "Enter") nameOk(); };
    if (!name()) askName();
  }

  return { $: $, reduce: reduce, name: name, askName: askName, sfx: sfx, tone: tone, ctx: ctx, confetti: confetti, best: best,
    start: start, end: end, show: show, hide: hide, result: result, options: options, rnd: rnd, count: count, swipe: swipe, keys: keys, css: css, shuffle: shuffle, shake: shake, init: init };
})();
</script>
<script>
(function () {
  var $ = G.$;
  /* ===== رسم الأعلام (300×200، السارية يساراً) ===== */
  var uid = 0;
  function rect(x, y, w, h, c) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"/>'; }
  function h3(a, b, c) { return rect(0, 0, 300, 67, a) + rect(0, 66.5, 300, 67, b) + rect(0, 133, 300, 67, c); }
  function v3(a, b, c) { return rect(0, 0, 100, 200, a) + rect(99.5, 0, 101, 200, b) + rect(200, 0, 100, 200, c); }
  function poly(pts, c) { return '<polygon points="' + pts + '" fill="' + c + '"/>'; }
  function star(cx, cy, r, c, n, rot, inner) {
    n = n || 5; rot = rot === undefined ? -90 : rot; inner = inner || r * .4;
    var p = [];
    for (var i = 0; i < n * 2; i++) {
      var rr = i % 2 ? inner : r, a = (rot + i * 180 / n) * Math.PI / 180;
      p.push((cx + rr * Math.cos(a)).toFixed(1) + "," + (cy + rr * Math.sin(a)).toFixed(1));
    }
    return poly(p.join(" "), c);
  }
  function cres(cx, cy, r, dx, r2, c) {
    var id = "m" + (++uid);
    return '<mask id="' + id + '"><rect width="300" height="200" fill="#000"/><circle cx="' + cx + '" cy="' + cy + '" r="' + r +
      '" fill="#fff"/><circle cx="' + (cx + dx) + '" cy="' + cy + '" r="' + r2 + '" fill="#000"/></mask><rect width="300" height="200" fill="' + c + '" mask="url(#' + id + ')"/>';
  }
  function txt(x, y, s, size, c) {
    return '<text x="' + x + '" y="' + y + '" font-size="' + size + '" fill="' + c + '" text-anchor="middle" font-family="Tahoma,Arial,sans-serif" font-weight="700" direction="rtl">' + s + '</text>';
  }
  function zig(n, edge, depth) {
    var p = ["0,0", edge + ",0"], h = 200 / n;
    for (var i = 0; i < n; i++) { p.push((edge + depth) + "," + (i * h + h / 2)); p.push(edge + "," + ((i + 1) * h)); }
    p.push("0,200"); return p.join(" ");
  }
  var FLAGS = {
    "السعودية": function () { return rect(0, 0, 300, 200, "#006C35") + txt(150, 92, "لا إله إلا الله محمد رسول الله", 22, "#fff") +
      '<path d="M232 140 H80 L64 134 L80 146 H232 Z" fill="#fff"/>' + rect(214, 132, 6, 22, "#fff") + rect(220, 138, 16, 8, "#fff"); },
    "الإمارات": function () { return rect(0, 0, 300, 67, "#00732F") + rect(0, 66.5, 300, 67, "#fff") + rect(0, 133, 300, 67, "#000") + rect(0, 0, 75, 200, "#FF0000"); },
    "الكويت": function () { return h3("#007A3D", "#fff", "#CE1126") + poly("0,0 75,67 75,133 0,200", "#000"); },
    "البحرين": function () { return rect(0, 0, 300, 200, "#CE1126") + poly(zig(5, 75, 38), "#fff"); },
    "قطر": function () { return rect(0, 0, 300, 200, "#8A1538") + poly(zig(9, 90, 30), "#fff"); },
    "اليمن": function () { return h3("#CE1126", "#fff", "#000"); },
    "الأردن": function () { return h3("#000", "#fff", "#007A3D") + poly("0,0 150,100 0,200", "#CE1126") + star(50, 100, 15, "#fff", 7); },
    "السودان": function () { return h3("#D21034", "#fff", "#000") + poly("0,0 100,100 0,200", "#007229"); },
    "فلسطين": function () { return h3("#000", "#fff", "#009736") + poly("0,0 100,100 0,200", "#EE2A35"); },
    "العراق": function () { return h3("#CE1126", "#fff", "#000") + txt(150, 111, "الله أكبر", 30, "#007A3D"); },
    "تركيا": function () { return rect(0, 0, 300, 200, "#E30A17") + cres(105, 100, 50, 13, 40, "#fff") + star(160, 100, 24, "#fff", 5, 180); },
    "الجزائر": function () { return rect(0, 0, 150, 200, "#006233") + rect(149.5, 0, 150.5, 200, "#fff") + cres(150, 100, 50, 13, 41, "#D21034") + star(170, 100, 24, "#D21034", 5, 180); },
    "تونس": function () { return rect(0, 0, 300, 200, "#E70013") + '<circle cx="150" cy="100" r="52" fill="#fff"/>' + cres(145, 100, 39, 10, 32, "#E70013") + star(160, 100, 19, "#E70013", 5, 180); },
    "ليبيا": function () { return rect(0, 0, 300, 50, "#E70013") + rect(0, 50, 300, 100, "#000") + rect(0, 150, 300, 50, "#239E46") + cres(140, 100, 28, 8, 23, "#fff") + star(162, 100, 13, "#fff", 5, 180); },
    "المغرب": function () {
      var p = [], i; for (i = 0; i < 5; i++) { var a = (-90 + i * 144) * Math.PI / 180; p.push((150 + 48 * Math.cos(a)).toFixed(1) + "," + (100 + 48 * Math.sin(a)).toFixed(1)); }
      return rect(0, 0, 300, 200, "#C1272D") + '<polygon points="' + p.join(" ") + '" fill="none" stroke="#006233" stroke-width="8" stroke-linejoin="round"/>';
    },
    "موريتانيا": function () { return rect(0, 0, 300, 200, "#006233") + rect(0, 0, 300, 30, "#D01C1F") + rect(0, 170, 300, 30, "#D01C1F") +
      '<mask id="mm"><rect width="300" height="200" fill="#000"/><circle cx="150" cy="92" r="48" fill="#fff"/><circle cx="150" cy="78" r="44" fill="#000"/></mask><rect width="300" height="200" fill="#FFD700" mask="url(#mm)"/>' + star(150, 88, 17, "#FFD700"); },
    "الصومال": function () { return rect(0, 0, 300, 200, "#4189DD") + star(150, 100, 45, "#fff"); },
    "باكستان": function () { return rect(0, 0, 75, 200, "#fff") + rect(74.5, 0, 225.5, 200, "#01411C") + cres(185, 100, 50, 18, 42, "#fff") + star(215, 75, 16, "#fff", 5, -60); },
    "اليابان": function () { return rect(0, 0, 300, 200, "#fff") + '<circle cx="150" cy="100" r="60" fill="#BC002D"/>'; },
    "الصين": function () { return rect(0, 0, 300, 200, "#EE1C25") + star(50, 50, 30, "#FFDE00") + star(100, 20, 10, "#FFDE00", 5, -60) + star(120, 40, 10, "#FFDE00", 5, -80) + star(120, 70, 10, "#FFDE00", 5, -100) + star(100, 90, 10, "#FFDE00", 5, -120); },
    "فرنسا": function () { return v3("#002654", "#fff", "#CE1126"); },
    "إيطاليا": function () { return v3("#009246", "#fff", "#CE2B37"); },
    "ألمانيا": function () { return h3("#000", "#DD0000", "#FFCE00"); },
    "روسيا": function () { return h3("#fff", "#0039A6", "#D52B1E"); },
    "إندونيسيا": function () { return rect(0, 0, 300, 100, "#CE1126") + rect(0, 99.5, 300, 100.5, "#fff"); },
    "بولندا": function () { return rect(0, 0, 300, 100, "#fff") + rect(0, 99.5, 300, 100.5, "#DC143C"); }
  };
  function flagSVG(name) {
    var f = FLAGS[name]; if (!f) return "";
    return '<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="علم">' + f() +
      '<rect x=".75" y=".75" width="298.5" height="198.5" fill="none" stroke="rgba(0,0,0,.15)" stroke-width="1.5"/></svg>';
  }
  var CAPS = [["السعودية", "الرياض"], ["الإمارات", "أبوظبي"], ["الكويت", "مدينة الكويت"], ["البحرين", "المنامة"], ["قطر", "الدوحة"],
    ["عُمان", "مسقط"], ["اليمن", "صنعاء"], ["الأردن", "عمّان"], ["العراق", "بغداد"], ["مصر", "القاهرة"], ["السودان", "الخرطوم"],
    ["ليبيا", "طرابلس"], ["تونس", "تونس"], ["الجزائر", "الجزائر"], ["المغرب", "الرباط"], ["موريتانيا", "نواكشوط"], ["الصومال", "مقديشو"],
    ["لبنان", "بيروت"], ["سوريا", "دمشق"], ["تركيا", "أنقرة"], ["باكستان", "إسلام آباد"], ["الهند", "نيودلهي"], ["اليابان", "طوكيو"],
    ["الصين", "بكين"], ["فرنسا", "باريس"], ["إيطاليا", "روما"], ["ألمانيا", "برلين"], ["روسيا", "موسكو"], ["بريطانيا", "لندن"],
    ["إسبانيا", "مدريد"], ["كندا", "أوتاوا"], ["أستراليا", "كانبرا"], ["بولندا", "وارسو"]];

  var getLvl = G.options("lvl", "flags", "1");
  var lvl = "1", qs = [], idx = 0, right = 0, marks = [], game = 0;

  function dots() {
    $("dots").innerHTML = "";
    for (var i = 0; i < 10; i++) { var d = document.createElement("i"); d.className = marks[i] || (i === idx ? "now" : ""); $("dots").appendChild(d); }
  }
  function newRound() {
    game++; lvl = getLvl(); idx = 0; right = 0; marks = [];
    if (lvl === "1") {
      var names = Object.keys(FLAGS);
      qs = G.shuffle(names).slice(0, 10).map(function (n) {
        return { flag: n, q: "علم أي دولة هذا؟", a: n, opts: [n].concat(G.shuffle(names.filter(function (x) { return x !== n; })).slice(0, 3)) };
      });
    } else {
      qs = G.shuffle(CAPS).slice(0, 10).map(function (c) {
        var others = G.shuffle(CAPS.filter(function (x) { return x[1] !== c[1]; })).slice(0, 3).map(function (x) { return x[1]; });
        return { flag: FLAGS[c[0]] ? c[0] : null, q: "ما عاصمة " + c[0] + "؟", a: c[1], opts: [c[1]].concat(others) };
      });
    }
    G.start("flags"); showQ();
  }
  function showQ() {
    var item = qs[idx]; dots();
    $("qnum").textContent = "السؤال " + (idx + 1) + " من 10";
    var f = $("flag"); f.className = "flag" + (lvl === "2" ? " small" : ""); f.innerHTML = item.flag ? flagSVG(item.flag) : "";
    $("q").textContent = item.q; $("fb").textContent = "";
    var box = $("ans"); box.innerHTML = "";
    G.shuffle(item.opts).forEach(function (a) {
      var b = document.createElement("button"); b.textContent = a;
      b.onclick = function () { answer(b, a === item.a); }; box.appendChild(b);
    });
  }
  function answer(btn, ok) {
    var g = game, item = qs[idx];
    [].slice.call($("ans").children).forEach(function (b) { b.disabled = true; if (b.textContent === item.a) b.classList.add("ok"); });
    if (ok) { right++; marks[idx] = "ok"; G.sfx.ok(); $("fb").textContent = ["صح! 👏", "ممتاز! 🌟", "أحسنت! 💪", "برافو! 🎉"][G.rnd(0, 3)]; }
    else { marks[idx] = "bad"; btn.classList.add("bad"); G.sfx.bad(); G.shake(btn); $("fb").textContent = "الإجابة الصحيحة: " + item.a; }
    dots();
    setTimeout(function () { if (g !== game) return; idx++; if (idx < 10) showQ(); else done(); }, G.reduce ? 300 : (ok ? 1000 : 1800));
  }
  function done() {
    var st = right === 10 ? 3 : right >= 7 ? 2 : right >= 4 ? 1 : 0, b = G.best("flags." + lvl, right), n = G.name();
    G.end("flags", { score: right, level: parseInt(lvl, 10), result: right + " من 10" });
    if (st >= 2) { G.sfx.win(); G.confetti(); } else G.sfx.tap();
    G.result({
      emoji: st === 3 ? "🏆" : st === 2 ? "🎉" : st === 1 ? "👍" : "💪",
      title: st >= 2 ? (n ? "أحسنت يا " + n + "!" : "أحسنت!") : (n ? "حلو يا " + n + "!" : "حلو!"),
      sub: (st ? "⭐".repeat(st) + "  " : "") + (st === 3 ? "كلها صح!" : "جرّب مرة ثانية وتعرف أكثر"),
      score: right + " من 10", best: b.best === null ? null : b.best + " من 10", isNew: b.isNew && right > 0,
      again: newRound, menu: function () { G.show("start"); }
    });
  }
  window.__flags = { FLAGS: FLAGS, flagSVG: flagSVG };

  $("menu").onclick = function () { G.sfx.tap(); game++; G.show("start"); };
  $("go").onclick = function () { G.ctx(); G.hide("start"); G.sfx.tap(); newRound(); };
  G.init();
})();
</script>
