<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--
  ═══════════ لا تعدّل هذا التعليق ═══════════
  الملف: games/quiz.html — لعبة «كويز قصير» (رمزها في السجل: quiz).
  - صفحة مستقلة تعمل وحدها بلا خادم وبلا اتصال. لا روابط لبقية الموقع ولا روابط خارجية، وزر 🎮 يرجع لبوابة الألعاب فقط.
  - الستايل: الاحتياطي داخلها (fallback، ألوانه متغيرات --g-*)، ثم ستايل games من share يغيّر الألوان والخط لكل الألعاب الجديدة معاً، ثم ستايل اللعبة نفسها.
  - الاسم: يُقرأ من بوابة الألعاب (game.name)، ولا يُسأل عنه إلا إذا فُتحت اللعبة وحدها بلا اسم.
  - السجل: كل كويز: score = الإجابات الصحيحة من 10، level 1 صغار و2 كبار، result «8 من 10».
  ═══════════════════════════════════════════
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a3fd0">
<title>كويز قصير</title>
<style id="fallback">
:root{
  --g-bg:#fbeef6; --g-bg2:#efe6ff; --g-ink:#3a2463; --g-sub:#7a6a98; --g-card:#ffffff; --g-line:#eadff7;
  --g-accent:#6a3fd0; --g-accent-d:#4a2a9a; --g-pink:#ff7aa8; --g-pink-d:#d9507f;
  --g-ok:#22b067; --g-ok-d:#168a4f; --g-bad:#ef4b5f; --g-bad-d:#b9293b; --g-warn:#ffc233; --g-warn-d:#c99100;
  --g-font:Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--g-font);color:var(--g-ink);background:linear-gradient(180deg,var(--g-bg),var(--g-bg2));background-attachment:fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--g-accent);outline-offset:2px}
.g-app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:8px 14px 18px;padding-top:max(8px,env(safe-area-inset-top))}
.g-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.g-top h1{flex:1;margin:0;font-size:22px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-ic{width:44px;height:44px;flex:none;border:0;border-radius:14px;background:var(--g-card);box-shadow:0 3px 0 var(--g-line);font-size:20px;display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--g-ink)}
.g-ic:active{transform:translateY(2px);box-shadow:0 1px 0 var(--g-line)}
.g-who{max-width:110px;height:44px;flex:none;border:0;border-radius:14px;background:var(--g-card);box-shadow:0 3px 0 var(--g-line);font-size:15px;font-weight:700;padding:0 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-card{background:var(--g-card);border:2px solid var(--g-line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--g-line)}
.g-btn{display:block;width:100%;min-height:56px;border:0;border-radius:18px;background:var(--g-accent);color:#fff;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--g-accent-d);cursor:pointer;margin-top:12px;padding:8px 14px}
.g-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--g-accent-d)}
.g-btn.soft{background:var(--g-card);color:var(--g-ink);box-shadow:0 5px 0 var(--g-line);border:2px solid var(--g-line)}
.g-btn.soft:active{box-shadow:0 1px 0 var(--g-line)}
.g-btn.warn{background:var(--g-warn);color:#3d2a00;box-shadow:0 5px 0 var(--g-warn-d)}
.g-btn.warn:active{box-shadow:0 1px 0 var(--g-warn-d)}
.g-btn:disabled{opacity:.45;cursor:default;transform:none}
.g-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.g-opts button{flex:1 1 28%;min-height:66px;border:3px solid var(--g-line);background:var(--g-card);border-radius:18px;font-size:18px;font-weight:700;cursor:pointer;padding:6px 4px}
.g-opts button small{display:block;font-size:13px;color:var(--g-sub);font-weight:400;margin-top:2px}
.g-opts button.sel{border-color:var(--g-accent);background:var(--g-accent);color:#fff}
.g-opts button.sel small{color:#fff}
.g-scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,20,70,.55);z-index:30;overflow-y:auto}
.g-scr.on{display:flex}
.g-scr.full{background:linear-gradient(180deg,var(--g-bg),var(--g-bg2))}
.g-box{width:100%;max-width:400px;text-align:center;background:var(--g-card);border-radius:26px;padding:22px 18px;box-shadow:0 8px 0 var(--g-line);margin:auto}
.g-big{font-size:72px;line-height:1.1}
.g-box h2{margin:6px 0;font-size:28px}
.g-box p{margin:6px 0;color:var(--g-sub);font-size:17px;line-height:1.6}
.g-box label{display:block;font-size:18px;font-weight:700;margin:14px 0 6px}
.g-hi{font-size:18px;font-weight:700;color:var(--g-accent);min-height:1.4em}
.g-in{width:100%;font:inherit;font-size:22px;text-align:center;padding:12px;border:3px solid var(--g-line);border-radius:16px;background:#fff;color:#2a1d48}
.g-recent{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.g-recent button{font:inherit;font-size:16px;border:2px solid var(--g-line);background:var(--g-bg2);border-radius:20px;padding:6px 14px;cursor:pointer}
.g-score{font-size:56px;font-weight:700;color:var(--g-accent);line-height:1.2}
.g-best{font-size:16px;color:var(--g-sub)}
.g-new{display:inline-block;background:var(--g-warn);color:#3d2a00;border-radius:12px;padding:2px 10px;font-weight:700;margin-top:4px}
.g-dl{display:block;margin-top:16px;font-size:15px;color:var(--g-sub);text-decoration:underline}
.g-dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-areas:". u ." "l d r";gap:8px;justify-content:center;margin-top:10px;direction:ltr}
.g-dpad button{height:58px;border:0;border-radius:16px;background:var(--g-card);box-shadow:0 4px 0 var(--g-line);font-size:26px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.g-dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g-line)}
.g-dpad .u{grid-area:u}.g-dpad .l{grid-area:l}.g-dpad .d{grid-area:d}.g-dpad .r{grid-area:r}
#g-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;display:none}
@keyframes g-pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes g-shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.g-popin{animation:g-pop .45s ease both}
.g-shake{animation:g-shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="/styles/games/style.css" onerror="this.remove()">
<style id="page-style">
.dots{display:flex;gap:5px;justify-content:center;margin:2px 0 10px;direction:rtl}
.dots i{flex:1;max-width:28px;height:10px;border-radius:6px;background:var(--g-line)}
.dots i.ok{background:var(--g-ok)} .dots i.bad{background:var(--g-bad)} .dots i.now{background:var(--g-accent)}
.qnum{text-align:center;color:var(--g-sub);font-size:15px;font-weight:700}
.q{font-size:23px;font-weight:700;line-height:1.6;text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans button{min-height:74px;border:3px solid var(--g-line);border-radius:18px;background:var(--g-card);box-shadow:0 5px 0 var(--g-line);font-size:19px;font-weight:700;cursor:pointer;padding:8px;line-height:1.35}
.ans button:active{transform:translateY(3px);box-shadow:0 2px 0 var(--g-line)}
.ans button:disabled{cursor:default;transform:none}
.ans button.ok{background:var(--g-ok);border-color:var(--g-ok);color:#fff;box-shadow:0 5px 0 var(--g-ok-d)}
.ans button.bad{background:var(--g-bad);border-color:var(--g-bad);color:#fff;box-shadow:0 5px 0 var(--g-bad-d)}
.fb{text-align:center;font-size:20px;font-weight:700;min-height:1.6em;margin-top:12px}
.stars{font-size:38px;letter-spacing:4px}
</style>

<body data-no-site-header="1">
<div class="g-app">
  <header class="g-top">
    <a class="g-ic" href="./" aria-label="الألعاب">🎮</a>
    <h1>كويز قصير</h1>
    <button class="g-ic" id="g-sound" aria-label="الصوت">🔊</button>
    <button class="g-who" id="g-who" aria-label="تغيير الاسم">مين يلعب؟</button>
  </header>
<div class="dots" id="dots"></div>
  <div class="g-card">
    <div class="qnum" id="qnum"></div>
    <div class="q" id="q"></div>
    <div class="ans" id="ans"></div>

  </div>
  <button class="g-btn soft" id="menu">غيّر الإعدادات ⚙️</button>

  <div class="g-scr full on" id="start">
    <div class="g-box">

      <h2>كويز قصير</h2>

      <div class="g-opts" id="lvl">

        <button data-v="2">🧑 كبار<small>معلومات عامة</small></button>

      <button class="g-btn warn" id="go">يلا نبدأ! 🚀</button>
    </div>
  </div>
</div>
<div class="g-scr" id="g-res" role="dialog" aria-modal="true" aria-labelledby="g-res-t">
  <div class="g-box">
    <div class="g-big g-popin" id="g-res-e"></div>

    <p id="g-res-s"></p>
    <div class="g-score" id="g-res-n"></div>
    <div class="g-best" id="g-res-b"></div>
    <button class="g-btn warn" id="g-res-again">العب مرة ثانية 🔁</button>
    <button class="g-btn soft" id="g-res-menu">غيّر الإعدادات ⚙️</button>
  </div>
</div>
<div class="g-scr full" id="g-name" role="dialog" aria-modal="true" aria-labelledby="g-name-t">
  <div class="g-box">
    <div class="g-big">👋</div>
    <h2 id="g-name-t">مين يلعب؟</h2>
    <p>اكتب اسمك عشان تنحسب نتيجتك</p>
    <div class="g-recent" id="g-recent"></div>
    <input class="g-in" id="g-name-in" maxlength="30" placeholder="اسمك" autocomplete="off">
    <button class="g-btn" id="g-name-ok">يلا 🚀</button>
  </div>
</div>
<canvas id="g-fx"></canvas>
