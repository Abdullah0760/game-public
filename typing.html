<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!--
  ═══════════ لا تعدّل هذا التعليق ═══════════
  الملف: games/typing.html — لعبة «سرعة الكتابة» (رمزها في السجل: typing).
  - صفحة مستقلة تعمل وحدها بلا خادم وبلا اتصال. لا روابط لبقية الموقع ولا روابط خارجية، وزر 🎮 يرجع لبوابة الألعاب فقط.
  - الستايل: الاحتياطي داخلها (fallback، ألوانه متغيرات --g-*)، ثم ستايل games من share يغيّر الألوان والخط لكل الألعاب الجديدة معاً، ثم ستايل اللعبة نفسها.
  - الاسم: يُقرأ من بوابة الألعاب (game.name)، ولا يُسأل عنه إلا إذا فُتحت اللعبة وحدها بلا اسم.
  - السجل: كل جولة 3 جمل: score = كلمة في الدقيقة، level 1 جمل قصيرة، 2 طويلة، result «الدقة 95٪».
  ═══════════════════════════════════════════
-->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6a3fd0">
<title>سرعة الكتابة</title>
<style id="fallback">
:root{
  --g-bg:#fbeef6; --g-bg2:#efe6ff; --g-ink:#3a2463; --g-sub:#7a6a98; --g-card:#ffffff; --g-line:#eadff7;
  --g-accent:#6a3fd0; --g-accent-d:#4a2a9a; --g-pink:#ff7aa8; --g-pink-d:#d9507f;
  --g-ok:#22b067; --g-ok-d:#168a4f; --g-bad:#ef4b5f; --g-bad-d:#b9293b; --g-warn:#ffc233; --g-warn-d:#c99100;
  --g-font:Tahoma,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--g-font);color:var(--g-ink);background:linear-gradient(180deg,var(--g-bg),var(--g-bg2));background-attachment:fixed;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--g-accent);outline-offset:2px}
.g-app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:8px 14px 18px;padding-top:max(8px,env(safe-area-inset-top))}
.g-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.g-top h1{flex:1;margin:0;font-size:22px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-ic{width:44px;height:44px;flex:none;border:0;border-radius:14px;background:var(--g-card);box-shadow:0 3px 0 var(--g-line);font-size:20px;display:grid;place-items:center;cursor:pointer;text-decoration:none;color:var(--g-ink)}
.g-ic:active{transform:translateY(2px);box-shadow:0 1px 0 var(--g-line)}
.g-who{max-width:110px;height:44px;flex:none;border:0;border-radius:14px;background:var(--g-card);box-shadow:0 3px 0 var(--g-line);font-size:15px;font-weight:700;padding:0 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-card{background:var(--g-card);border:2px solid var(--g-line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--g-line)}
.g-btn{display:block;width:100%;min-height:56px;border:0;border-radius:18px;background:var(--g-accent);color:#fff;font-size:20px;font-weight:700;box-shadow:0 5px 0 var(--g-accent-d);cursor:pointer;margin-top:12px;padding:8px 14px}
.g-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--g-accent-d)}
.g-btn.soft{background:var(--g-card);color:var(--g-ink);box-shadow:0 5px 0 var(--g-line);border:2px solid var(--g-line)}
.g-btn.soft:active{box-shadow:0 1px 0 var(--g-line)}
.g-btn.warn{background:var(--g-warn);color:#3d2a00;box-shadow:0 5px 0 var(--g-warn-d)}
.g-btn.warn:active{box-shadow:0 1px 0 var(--g-warn-d)}
.g-btn:disabled{opacity:.45;cursor:default;transform:none}
.g-opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.g-opts button{flex:1 1 28%;min-height:66px;border:3px solid var(--g-line);background:var(--g-card);border-radius:18px;font-size:18px;font-weight:700;cursor:pointer;padding:6px 4px}
.g-opts button small{display:block;font-size:13px;color:var(--g-sub);font-weight:400;margin-top:2px}
.g-opts button.sel{border-color:var(--g-accent);background:var(--g-accent);color:#fff}
.g-opts button.sel small{color:#fff}
.g-scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,20,70,.55);z-index:30;overflow-y:auto}
.g-scr.on{display:flex}
.g-scr.full{background:linear-gradient(180deg,var(--g-bg),var(--g-bg2))}
.g-box{width:100%;max-width:400px;text-align:center;background:var(--g-card);border-radius:26px;padding:22px 18px;box-shadow:0 8px 0 var(--g-line);margin:auto}
.g-big{font-size:72px;line-height:1.1}
.g-box h2{margin:6px 0;font-size:28px}
.g-box p{margin:6px 0;color:var(--g-sub);font-size:17px;line-height:1.6}
.g-box label{display:block;font-size:18px;font-weight:700;margin:14px 0 6px}
.g-hi{font-size:18px;font-weight:700;color:var(--g-accent);min-height:1.4em}
.g-in{width:100%;font:inherit;font-size:22px;text-align:center;padding:12px;border:3px solid var(--g-line);border-radius:16px;background:#fff;color:#2a1d48}
.g-recent{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.g-recent button{font:inherit;font-size:16px;border:2px solid var(--g-line);background:var(--g-bg2);border-radius:20px;padding:6px 14px;cursor:pointer}
.g-score{font-size:56px;font-weight:700;color:var(--g-accent);line-height:1.2}
.g-best{font-size:16px;color:var(--g-sub)}
.g-new{display:inline-block;background:var(--g-warn);color:#3d2a00;border-radius:12px;padding:2px 10px;font-weight:700;margin-top:4px}
.g-dl{display:block;margin-top:16px;font-size:15px;color:var(--g-sub);text-decoration:underline}
.g-dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-areas:". u ." "l d r";gap:8px;justify-content:center;margin-top:10px;direction:ltr}
.g-dpad button{height:58px;border:0;border-radius:16px;background:var(--g-card);box-shadow:0 4px 0 var(--g-line);font-size:26px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.g-dpad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--g-line)}
.g-dpad .u{grid-area:u}.g-dpad .l{grid-area:l}.g-dpad .d{grid-area:d}.g-dpad .r{grid-area:r}
#g-fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;display:none}
@keyframes g-pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes g-shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.g-popin{animation:g-pop .45s ease both}
.g-shake{animation:g-shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<link rel="stylesheet" href="/styles/games/style.css" onerror="this.remove()">
<style id="page-style">
.hud{display:flex;gap:8px;margin-bottom:10px}
.hud .sc{flex:1;background:var(--g-card);border:2px solid var(--g-line);border-radius:16px;text-align:center;padding:4px}
.hud b{display:block;font-size:24px;line-height:1.2}
.hud span{font-size:13px;color:var(--g-sub)}
.prog{text-align:center;color:var(--g-sub);font-weight:700;margin-bottom:8px}
.target{font-size:26px;line-height:1.9;text-align:center;font-weight:700;color:var(--g-sub);word-break:break-word}
.target .c{color:var(--g-ok-d)}
.target .w{color:#fff;background:var(--g-bad);border-radius:4px}
.target .n{border-bottom:3px solid var(--g-accent)}
.typ{width:100%;margin-top:14px;font:inherit;font-size:24px;padding:14px;border:3px solid var(--g-line);border-radius:18px;background:#fff;color:#2a1d48;text-align:right}
.typ.bad{border-color:var(--g-bad)}
.typ.good{border-color:var(--g-ok)}
.tip{text-align:center;color:var(--g-sub);font-size:14px;margin-top:8px}
</style>
</head>
<body data-no-site-header="1">
<div class="g-app">
  <header class="g-top">
    <a class="g-ic" href="./" aria-label="الألعاب">🎮</a>
    <h1>سرعة الكتابة</h1>
    <button class="g-ic" id="g-sound" aria-label="الصوت">🔊</button>
    <button class="g-who" id="g-who" aria-label="تغيير الاسم">مين يلعب؟</button>
  </header>
<div class="hud">
    <div class="sc"><b id="sTime">0</b><span>⏱️ ثانية</span></div>
    <div class="sc"><b id="sErr">0</b><span>❌ أخطاء</span></div>
  </div>
  <div class="prog" id="prog"></div>
  <div class="g-card">
    <div class="target" id="target"></div>
    <input class="typ" id="typ" dir="rtl" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="اكتب هنا..." aria-label="اكتب الجملة">
    <div class="tip">الهمزات والتشكيل ما تهم: «ا» و«أ» نفس الشي ✋</div>
  </div>
  <button class="g-btn soft" id="menu">غيّر الإعدادات ⚙️</button>

  <div class="g-scr full on" id="start">
    <div class="g-box">
      <div class="g-big">⌨️⚡</div>
      <h2>سرعة الكتابة</h2>
      <div class="g-hi" id="g-hi"></div>
      <p>تظهر جملة، اكتبها بأسرع ما تقدر وبدون أخطاء. ثلاث جمل وتطلع سرعتك!</p>
      <label>الجمل:</label>
      <div class="g-opts" id="lvl">
        <button data-v="1">قصيرة<small>للمبتدئين</small></button>
        <button data-v="2">طويلة<small>للمحترفين</small></button>
      </div>
      <button class="g-btn warn" id="go">يلا نبدأ! 🚀</button>
    </div>
  </div>
</div>
<div class="g-scr" id="g-res" role="dialog" aria-modal="true" aria-labelledby="g-res-t">
  <div class="g-box">
    <div class="g-big g-popin" id="g-res-e"></div>
    <h2 id="g-res-t"></h2>
    <p id="g-res-s"></p>
    <div class="g-score" id="g-res-n"></div>
    <div class="g-best" id="g-res-b"></div>
    <button class="g-btn warn" id="g-res-again">العب مرة ثانية 🔁</button>
    <button class="g-btn soft" id="g-res-menu">غيّر الإعدادات ⚙️</button>
  </div>
</div>
<div class="g-scr full" id="g-name" role="dialog" aria-modal="true" aria-labelledby="g-name-t">
  <div class="g-box">
    <div class="g-big">👋</div>
    <h2 id="g-name-t">مين يلعب؟</h2>
    <p>اكتب اسمك عشان تنحسب نتيجتك</p>
    <div class="g-recent" id="g-recent"></div>
    <input class="g-in" id="g-name-in" maxlength="30" placeholder="اسمك" autocomplete="off">
    <button class="g-btn" id="g-name-ok">يلا 🚀</button>
  </div>
</div>
<canvas id="g-fx"></canvas>

    document.addEventListener("keyup", function (e) { if (M[e.key]) fn(M[e.key], false); });
  }
  /* لون من متغيرات الستايل، حتى ترسم اللوحات بألوان ستايل الألعاب */
  function css(name, def) {
    try { var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v || def; } catch (e) { return def; }
  }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function shake(el) { el.classList.remove("g-shake"); void el.offsetWidth; el.classList.add("g-shake"); }

  /* زر تحميل اللعبة: على الكمبيوتر فقط، لأن الجوال لا يشغّل الملف المحمَّل */
  function download() {
    try {
      if (location.protocol === "file:") return;
      var ua = navigator.userAgent || "";
      var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(ua) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua));
      var fine = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
      var box = document.querySelector("#start .g-box");
      if (mobile || !fine || !box) return;
      var f = location.pathname.split("/").pop() || "index.html";
      var a = document.createElement("a"); a.className = "g-dl"; a.href = f; a.download = (document.title || f) + ".html";
      a.textContent = "⬇️ حمّل اللعبة للكمبيوتر (تعمل بلا إنترنت)";
      box.appendChild(a);
    } catch (e) {}
  }

  function init() {
    showName(); showSound(); download();
    $("g-sound").onclick = function () { muted = !muted; set("game.muted", muted ? "1" : "0"); showSound(); if (!muted) sfx.tap(); };
    $("g-who").onclick = function () { askName(); };
    $("g-name-ok").onclick = nameOk;
    $("g-name-in").onkeydown = function (e) { if (e.key === "Enter") nameOk(); };
    if (!name()) askName();
  }

  return { $: $, reduce: reduce, name: name, askName: askName, sfx: sfx, tone: tone, ctx: ctx, confetti: confetti, best: best,
    start: start, end: end, show: show, hide: hide, result: result, options: options, rnd: rnd, count: count, swipe: swipe, keys: keys, css: css, shuffle: shuffle, shake: shake, init: init };
})();
</script>
<script>
(function () {
  var $ = G.$;
  var TEXTS = {
    "1": ["أحب اللعب مع أصدقائي", "الشمس تشرق كل صباح", "القطة تشرب الحليب", "الماء مهم للحياة", "أمي تحب الورد",
          "السماء زرقاء والغيوم بيضاء", "أقرأ كتابا كل يوم", "النحلة تصنع العسل", "المدينة المنورة مدينة جميلة", "أساعد أبي في البيت"],
    "2": ["النظافة من الإيمان والصدق من أجمل الأخلاق", "يزرع الفلاح القمح في الحقل ويسقيه بالماء", "تعلمت اليوم درسا جديدا عن الكواكب والنجوم",
          "الرياضة تقوي الجسم وتجعلنا نشعر بالنشاط", "زرت مع عائلتي الحديقة وشاهدنا الطيور الملونة", "القراءة تفتح لنا أبوابا كثيرة من المعرفة",
          "نحافظ على الماء ولا نسرف في استخدامه", "الوقت كالسيف إن لم تقطعه قطعك"]
  };
  var ROUNDS = 3;
  var getLvl = G.options("lvl", "typing", "1");
  var lvl = "1", list = [], si = 0, errs = 0, typedChars = 0, words = 0, t0 = 0, total = 0, timer = null, run = 0, last = "";
  var inp = $("typ");

  function norm(s) {
    return s.replace(/[ً-ْـ]/g, "").replace(/[أإآٱ]/g, "ا").replace(/ى/g, "ي").replace(/\s+/g, " ");
  }
  function elapsed() { return total + (t0 ? (Date.now() - t0) / 1000 : 0); }
  function hud() { $("sTime").textContent = Math.floor(elapsed()); $("sErr").textContent = errs; }
  function render(typed) {
    var tgt = list[si], nt = norm(tgt), nTyped = norm(typed), box = $("target"), wrong = false;
    box.innerHTML = "";
    var chars = Array.from(tgt);
    chars.forEach(function (ch, i) {
      var s = document.createElement("span"); s.textContent = ch;
      if (i < nTyped.length) s.className = nTyped[i] === nt[i] ? "c" : (wrong = true, "w");
      else if (i === nTyped.length) s.className = "n";
      box.appendChild(s);
    });
    if (nTyped.length > nt.length) wrong = true;
    inp.classList.toggle("bad", wrong); inp.classList.toggle("good", !wrong && nTyped.length > 0);
    return { done: nTyped === nt, wrong: wrong };
  }
  function show() {
    $("prog").textContent = "الجملة " + (si + 1) + " من " + ROUNDS;
    inp.value = ""; last = ""; render("");
    setTimeout(function () { try { inp.focus(); } catch (e) {} }, 50);
  }
  function newGame() {
    run++; clearInterval(timer); lvl = getLvl(); list = G.shuffle(TEXTS[lvl]).slice(0, ROUNDS);
    si = 0; errs = 0; words = 0; typedChars = 0; t0 = 0; total = 0; inp.disabled = false; hud(); show(); G.start("typing");
    var r = run; timer = setInterval(function () { if (r === run) hud(); }, 250);
  }
  inp.addEventListener("input", function () {
    if (inp.disabled) return;
    if (!t0) t0 = Date.now();
    var v = inp.value, res = render(v);
    if (norm(v).length > norm(last).length) {
      typedChars++;
      var nv = norm(v), nt = norm(list[si]), i = nv.length - 1;
      if (nv[i] !== nt[i]) { errs++; G.sfx.bad(); } else G.sfx.tap();
    }
    last = v; hud();
    if (res.done) {
      total += (Date.now() - t0) / 1000; t0 = 0; words += list[si].split(" ").length; G.sfx.ok();
      si++;
      if (si < ROUNDS) show(); else done();
    }
  });
  function done() {
    run++; clearInterval(timer); inp.disabled = true; inp.blur(); hud();
    var mins = Math.max(total, 1) / 60, wpm = Math.round(words / mins);
    var acc = typedChars ? Math.max(0, Math.round((typedChars - errs) / typedChars * 100)) : 100;
    var b = G.best("typing." + lvl, wpm), n = G.name();
    G.end("typing", { score: wpm, level: parseInt(lvl, 10), result: "الدقة " + acc + "٪" });
    if (b.isNew || wpm >= 30) { G.sfx.win(); G.confetti(); } else G.sfx.tap();
    setTimeout(function () {
      G.result({
        emoji: wpm >= 40 ? "🚀" : wpm >= 20 ? "🎉" : "👍",
        title: n ? "أحسنت يا " + n + "!" : "أحسنت!",
        sub: "كتبت في " + G.count(Math.round(total), "ثانية", "ثانيتين", "ثوانٍ") + "، والدقة " + acc + "٪",
        score: wpm + " كلمة في الدقيقة", best: b.best === null ? null : b.best + " كلمة في الدقيقة", isNew: b.isNew,
        again: newGame, menu: function () { G.show("start"); }
      });
    }, G.reduce ? 150 : 500);
  }

  $("menu").onclick = function () { G.sfx.tap(); run++; clearInterval(timer); G.show("start"); };
  $("go").onclick = function () { G.ctx(); G.hide("start"); G.sfx.tap(); newGame(); };
  G.init();
})();
</script>
<script src="/game.js" defer></script>
</body>
